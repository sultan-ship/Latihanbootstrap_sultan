<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Website Profil Pribadi</title>

    <!-- CDN CSS Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body>
  <!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
  
    <div class="container">
        <a class="navbar-brand fw-bold" href="#">
            CV SULTAN
        </a>
        <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#menuNavbar">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menuNavbar">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" href="#home">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#profil">Profil</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#galeri">Galeri</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#kontak">Kontak</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- CAROUSEL -->
<section id="home">

    <div id="carouselProfil"
         class="carousel slide"
         data-bs-ride="carousel">

        <!-- Indikator -->
        <div class="carousel-indicators">

            <button type="button"
                    data-bs-target="#carouselProfil"
                    data-bs-slide-to="0"
                    class="active">
            </button>
            <button type="button"
                    data-bs-target="#carouselProfil"
                    data-bs-slide-to="1">
            </button>
            <button type="button"
                    data-bs-target="#carouselProfil"
                    data-bs-slide-to="2">
            </button>
        </div>

        <!-- Gambar Carousel -->
        <div class="carousel-inner">

            <!-- FOTO SLIDE 1 -->
                <div class="carousel-item active">
                    <img src="https://images.unsplash.com/photo-1516321318423-f06f85e504b3?auto=format&fit=crop&w=1400&q=80"
                         class="d-block w-100"
                         alt="Belajar teknologi">

                    <div class="carousel-caption">
                        <h1>Selamat Datang di Profile Saya</h1>
                        <p>Siswa XI RPL 3 SMKN 9 Medan</p>
                    </div>
                </div>

                <!-- FOTO SLIDE 2 -->
                <div class="carousel-item">
                    <img src="https://images.unsplash.com/photo-1498050108023-c5249f4df085?auto=format&fit=crop&w=1400&q=80"
                         class="d-block w-100"
                         alt="Pemrograman komputer">

                    <div class="carousel-caption">
                        <h1>Belajar dan Berkarya</h1>
                        <p>Mengembangkan kemampuan di bidang teknologi.</p>
                    </div>
                </div>

                <!-- FOTO SLIDE 3 -->
                <div class="carousel-item">
                    <img src="https://images.unsplash.com/photo-1519389950473-47ba0277781c?auto=format&fit=crop&w=1400&q=80"
                         class="d-block w-100"
                         alt="Kerja sama tim">

                    <div class="carousel-caption">
                        <h1>Masa Depan Digital</h1>
                        <p>Terus belajar untuk menjadi programmer.</p>
                    </div>
                </div>
        </div>
        <!-- Tombol Sebelumnya -->
        <button class="carousel-control-prev"
                type="button"
                data-bs-target="#carouselProfil"
                data-bs-slide="prev">
            <span class="carousel-control-prev-icon"></span>
        </button>
        <!-- Tombol Berikutnya -->
        <button class="carousel-control-next"
                type="button"
                data-bs-target="#carouselProfil"
                data-bs-slide="next">
            <span class="carousel-control-next-icon"></span>
        </button>
    </div>
</section>
    <!-- CDN JavaScript Bootstrap -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>
</html>
